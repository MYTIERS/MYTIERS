<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0d14;
            --navbar-bg: #111723;
            --card-bg: #111726;
            --input-bg: #0d121c;
            --border-color: #1e293b;
            --text-gray: #8d9bb0;
            --active-blue: #3b82f6;
            --gold: #f1a823;
            --silver: #b2bdc4;
            --bronze: #e06e38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 10px;
            direction: ltr;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Top Header Navigation Bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            gap: 10px;
            margin-bottom: 10px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 18px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }

        .logo-my {
            color: #2563eb;
            background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-tiers {
            color: #f59e0b;
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 2px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 6px 10px 6px 30px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 11px;
        }

        /* Categories Bar */
        .modes-nav-container {
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 10px;
        }

        .modes-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }

        .modes-scroll::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            padding: 6px 8px;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-gray);
            flex-shrink: 0;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 700;
        }

        .nav-item.active {
            background: #1c2638;
            border-color: var(--active-blue);
            color: #ffffff;
        }

        /* Server Info Banner */
        .server-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
        }

        .info-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
        }

        .info-btn i {
            color: #3b82f6;
            font-size: 13px;
        }

        .server-box {
            display: flex;
            align-items: center;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 10px;
            gap: 10px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .server-title-text {
            font-size: 12px;
            font-weight: 900;
            color: #ef4444;
            font-family: 'Arial Black', sans-serif;
        }

        .ip-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .ip-label {
            font-size: 9px;
            color: var(--text-gray);
        }

        .ip-address {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        /* Leaderboard Cards */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* البنر العريض المائل بأسلوب الصورة تماماً */
        .player-banner {
            position: relative;
            width: 100%;
            height: 52px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            clip-path: polygon(0 0, 84% 0, 98% 100%, 0% 100%);
        }

        .player-banner.rank-1 { background-color: var(--gold); }
        .player-banner.rank-2 { background-color: var(--silver); }
        .player-banner.rank-3 { background-color: var(--bronze); }
        .player-banner.rank-other { background-color: #1e293b; }

        .rank-number {
            font-size: 34px;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            text-shadow: 2px 3px 0px rgba(0, 0, 0, 0.25);
            line-height: 1;
        }

        .player-skin {
            height: 110%;
            object-fit: contain;
            margin-right: 12px;
            filter: drop-shadow(-3px 3px 4px rgba(0, 0, 0, 0.3));
        }

        .levels-title {
            text-align: right;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gray);
            padding-right: 4px;
        }

        /* المستويات الدائرية على اليمين */
        .tiers-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-bottom: 2px;
        }

        .level-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            border-radius: 10px;
            width: 44px;
            height: 42px;
            border: 1px solid var(--border-color);
        }

        .level-pill.border-gold { border-color: var(--gold); }
        .level-pill.border-bronze { border-color: var(--bronze); }
        .level-pill.border-blue { border-color: var(--active-blue); }

        .level-label {
            font-size: 10px;
            font-weight: 900;
            color: #f59e0b;
            line-height: 1;
        }

        .level-num {
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterPlayers()" placeholder="Search player...">
            </div>
        </div>

        <!-- Modes Bar -->
        <div class="modes-nav-container">
            <div class="modes-scroll">
                <div class="nav-item active" onclick="selectMode('overall', this)">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <span>Overall</span>
                </div>
                <div class="nav-item" onclick="selectMode('vanilla', this)">
                    <i class="fa-solid fa-gem" style="color: #a855f7;"></i>
                    <span>VANILLA</span>
                </div>
                <div class="nav-item" onclick="selectMode('uhc', this)">
                    <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
                    <span>UHC</span>
                </div>
                <div class="nav-item" onclick="selectMode('pot', this)">
                    <i class="fa-solid fa-flask" style="color: #ec4899;"></i>
                    <span>POT</span>
                </div>
            </div>
        </div>

        <!-- Server Banner -->
        <div class="server-banner">
            <button class="info-btn">
                <i class="fa-solid fa-circle-info"></i>
                <span>معلومة</span>
            </button>

            <div class="server-box">
                <span class="server-title-text">PVP MIKEY</span>
                <div class="ip-container">
                    <span class="ip-label">عنوان IP للخادم</span>
                    <span class="ip-address" onclick="copyIP()">MYPVP.Mikey <i class="fa-regular fa-copy"></i></span>
                </div>
                <a href="https://discord.gg/3HtDCJV3x" target="_blank" class="discord-btn"><i class="fa-brands fa-discord"></i></a>
            </div>
        </div>

        <!-- Leaderboard List -->
        <div class="leaderboard-list" id="leaderboardList"></div>

    </div>

    <script>
        const playersData = [
            {
                name: "iRuby_X",
                skinUrl: "https://visage.surgeplay.com/bust/512/iRuby_X.png",
                levels: [
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "1", style: "border-gold" }
                ]
            },
            {
                name: "M4ster",
                skinUrl: "https://visage.surgeplay.com/bust/512/M4ster.png",
                levels: [
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "3", style: "border-bronze" }
                ]
            },
            {
                name: "Alex",
                skinUrl: "https://visage.surgeplay.com/bust/512/Alex.png",
                levels: [
                    { type: "HT", num: "3", style: "border-bronze" },
                    { type: "HT", num: "1", style: "border-gold" },
                    { type: "HT", num: "2", style: "border-blue" },
                    { type: "HT", num: "2", style: "border-blue" }
                ]
            }
        ];

        function renderLeaderboard() {
            const container = document.getElementById("leaderboardList");
            container.innerHTML = "";

            playersData.forEach((player, index) => {
                const rankNum = index + 1;
                let rankClass = "rank-other";
                if (rankNum === 1) rankClass = "rank-1";
                if (rankNum === 2) rankClass = "rank-2";
                if (rankNum === 3) rankClass = "rank-3";

                const card = document.createElement("div");
                card.className = "player-card";
                card.setAttribute("data-name", player.name);

                let levelsHTML = "";
                player.levels.forEach(lvl => {
                    levelsHTML += `
                        <div class="level-pill ${lvl.style}">
                            <span class="level-label">${lvl.type}</span>
                            <span class="level-num">${lvl.num}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="player-banner ${rankClass}">
                        <span class="rank-number">${rankNum}.</span>
                        <img class="player-skin" src="${player.skinUrl}" alt="${player.name}" onerror="this.src='https://visage.surgeplay.com/bust/512/Steve.png'">
                    </div>
                    <div class="levels-title">المستويات</div>
                    <div class="tiers-row">
                        ${levelsHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectMode(mode, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        function filterPlayers() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.player-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name') || "";
                card.style.display = name.toLowerCase().includes(input) ? "flex" : "none";
            });
        }

        function copyIP() {
            navigator.clipboard.writeText("MYPVP.Mikey");
            alert("تم نسخ IP الخادم: MYPVP.Mikey");
        }

        renderLeaderboard();
    </script>
</body>
</html>
