<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --navbar-bg: #151d2a;
            --card-bg: #141c2b;
            --input-bg: #111827;
            --border-color: #232f42;
            --text-gray: #8d9bb0;
            --active-blue: #3b82f6;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: ltr;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Header Navigation Bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }

        .logo-my {
            color: #2563eb;
            background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-tiers {
            color: #f59e0b;
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 2px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px 8px 34px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--active-blue);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 12px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Scrollable Categories Bar */
        .modes-nav-container {
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modes-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .modes-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .modes-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 68px;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-gray);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .nav-item img {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            object-fit: contain;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            background: #212d42;
            border-color: var(--active-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        /* Server Info Banner */
        .server-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .info-btn i {
            color: #3b82f6;
            font-size: 14px;
        }

        .server-box {
            display: flex;
            align-items: center;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .server-title-text {
            font-size: 13px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
        }

        .ip-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ip-label {
            font-size: 10px;
            color: var(--text-gray);
            font-weight: 500;
        }

        .ip-address {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ip-address i {
            font-size: 10px;
            color: var(--text-gray);
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* Leaderboard Player Cards */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-badge {
            background: #d97706;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .avatar-box {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: #232f42;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            direction: rtl;
            align-items: flex-start;
        }

        .player-name {
            font-weight: 800;
            font-size: 15px;
            color: #ffffff;
        }

        .player-subtitle {
            font-size: 11px;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .points-badge {
            color: #93c5fd;
            font-weight: 600;
        }

        .region-badge {
            background: #065f46;
            color: #34d399;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        /* Tier Slots Row */
        .tiers-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tiers-row::-webkit-scrollbar {
            display: none;
        }

        .tier-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            min-width: 50px;
            gap: 4px;
            flex-shrink: 0;
        }

        .tier-slot i {
            font-size: 14px;
            color: var(--text-gray);
        }

        .tier-slot.active-tier {
            border-color: var(--gold);
        }

        .tier-slot.active-tier i {
            color: var(--gold);
        }

        .tier-label {
            font-size: 9px;
            color: var(--text-gray);
            font-weight: 600;
            white-space: nowrap;
        }

        .tier-label.gold-text {
            color: var(--gold);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header Bar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterPlayers()" placeholder="Search player...">
            </div>

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Scrollable Categories Bar -->
        <div class="modes-nav-container">
            <div class="modes-scroll">
                
                <div class="nav-item active" onclick="selectMode('overall', this)">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <span>Overall</span>
                </div>

                <div class="nav-item" onclick="selectMode('vanilla', this)">
                    <img src="./vanilla.svg" alt="Vanilla" onerror="this.src='https://cdn-icons-png.flaticon.com/512/188/188333.png'">
                    <span>VANILLA</span>
                </div>

                <div class="nav-item" onclick="selectMode('uhc', this)">
                    <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
                    <span>UHC</span>
                </div>

                <div class="nav-item" onclick="selectMode('pot', this)">
                    <img src="./pot.svg" alt="Pot" onerror="this.src='https://cdn-icons-png.flaticon.com/512/868/868781.png'">
                    <span>POT</span>
                </div>

                <div class="nav-item" onclick="selectMode('nethop', this)">
                    <img src="./nethop.svg" alt="NethOP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3522/3522292.png'">
                    <span>NETHOP</span>
                </div>

                <div class="nav-item" onclick="selectMode('smp', this)">
                    <img src="./smp.svg" alt="SMP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041883.png'">
                    <span>SMP</span>
                </div>

                <div class="nav-item" onclick="selectMode('sword', this)">
                    <img src="./sword.svg" alt="Sword" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                    <span>SWORD</span>
                </div>

                <div class="nav-item" onclick="selectMode('axe', this)">
                    <img src="./axe.svg" alt="Axe" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869108.png'">
                    <span>AXE</span>
                </div>

                <div class="nav-item" onclick="selectMode('mace', this)">
                    <img src="./mace.svg" alt="Mace" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869112.png'">
                    <span>MACE</span>
                </div>

                <div class="nav-item" onclick="selectMode('spearmace', this)">
                    <img src="./spearmace.svg" alt="Spear Mace" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                    <span>SPEAR MACE</span>
                </div>

            </div>
        </div>

        <!-- Server Banner -->
        <div class="server-banner">
            <button class="info-btn">
                <i class="fa-solid fa-circle-info"></i>
                <span>معلومة</span>
            </button>

            <div class="server-box">
                <span class="server-title-text">PVP MIKEY</span>

                <div class="ip-container">
                    <span class="ip-label">عنوان IP للخادم</span>
                    <span class="ip-address" onclick="copyIP()">
                        MYPVP.Mikey
                        <i class="fa-regular fa-copy"></i>
                    </span>
                </div>

                <a href="https://discord.gg/3HtDCJV3x" target="_blank" class="discord-btn" title="Join Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
            </div>
        </div>

        <!-- Leaderboard List -->
        <div class="leaderboard-list" id="leaderboardList"></div>

    </div>

    <script>
        const playersData = [
            {
                name: "iRuby_X",
                points: 60,
                subtitle: "متخصص قتالي",
                region: "EU",
                avatar: "https://mc-heads.net/avatar/iRuby_X/42",
                ranks: {
                    gem: "غير مصنف",
                    heart: "غير مصنف",
                    flask: "غير مصنف",
                    discord: "غير مصنف",
                    eye: "غير مصنف",
                    sword: "HT1",
                    shield: "غير مصنف"
                },
                modes: {
                    vanilla: "HT1",
                    uhc: "غير مصنف",
                    pot: "غير مصنف",
                    nethop: "HT1",
                    smp: "غير مصنف",
                    sword: "HT1",
                    axe: "LT1",
                    mace: "LT2",
                    spearmace: "HT2"
                }
            },
            {
                name: "Mustfa_105",
                points: 42,
                subtitle: "طالب عسكري قتالي",
                region: "EU",
                avatar: "https://mc-heads.net/avatar/Mustfa_105/42",
                ranks: {
                    gem: "LT3",
                    heart: "غير مصنف",
                    flask: "غير مصنف",
                    eye: "LT3",
                    key: "LT2",
                    hammer: "HT3"
                },
                modes: {
                    vanilla: "LT3",
                    uhc: "HT3",
                    pot: "LT2",
                    nethop: "LT3",
                    smp: "HT3",
                    sword: "غير مصنف",
                    axe: "HT3",
                    mace: "LT3",
                    spearmace: "LT2"
                }
            }
        ];

        function renderLeaderboard(mode = 'overall') {
            const container = document.getElementById("leaderboardList");
            container.innerHTML = "";

            let displayPlayers = [...playersData];

            if (mode !== 'overall') {
                displayPlayers.sort((a, b) => {
                    const tierA = a.modes[mode] || "غير مصنف";
                    const tierB = b.modes[mode] || "غير مصنف";
                    if (tierA.includes("HT") && !tierB.includes("HT")) return -1;
                    if (!tierA.includes("HT") && tierB.includes("HT")) return 1;
                    return 0;
                });
            }

            displayPlayers.forEach((player, index) => {
                const card = document.createElement("div");
                card.className = "player-card";

                let tiersHTML = "";
                if (mode === 'overall') {
                    for (const [iconKey, tierVal] of Object.entries(player.ranks)) {
                        const isGold = tierVal !== "غير مصنف";
                        let iconClass = "fa-solid fa-gem";
                        if (iconKey === "heart") iconClass = "fa-solid fa-heart";
                        if (iconKey === "flask") iconClass = "fa-solid fa-flask";
                        if (iconKey === "discord") iconClass = "fa-brands fa-discord";
                        if (iconKey === "eye") iconClass = "fa-solid fa-eye";
                        if (iconKey === "sword") iconClass = "fa-solid fa-sword";
                        if (iconKey === "shield") iconClass = "fa-solid fa-shield-halved";
                        if (iconKey === "key") iconClass = "fa-solid fa-key";
                        if (iconKey === "hammer") iconClass = "fa-solid fa-hammer";

                        tiersHTML += `
                            <div class="tier-slot ${isGold ? 'active-tier' : ''}">
                                <i class="${iconClass}"></i>
                                <span class="tier-label ${isGold ? 'gold-text' : ''}">${tierVal}</span>
                            </div>
                        `;
                    }
                } else {
                    const currentTier = player.modes[mode] || "غير مصنف";
                    const isGold = currentTier !== "غير مصنف";
                    tiersHTML = `
                        <div class="tier-slot ${isGold ? 'active-tier' : ''}" style="min-width: 120px;">
                            <span class="tier-label" style="font-size: 10px;">الرتبة في ${mode.toUpperCase()}</span>
                            <span class="tier-label ${isGold ? 'gold-text' : ''}" style="font-size: 14px;">${currentTier}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="player-header">
                        <div class="player-info-left">
                            <span class="rank-badge" style="${index === 1 ? 'background:#64748b;' : ''}">${index + 1}.</span>
                            <div class="avatar-box">
                                <img src="${player.avatar}" alt="${player.name}">
                            </div>
                            <div class="player-details">
                                <span class="player-name">${player.name}</span>
                                <span class="player-subtitle">
                                    ${player.subtitle} <span class="points-badge">(${player.points} نقطة)</span>
                                </span>
                            </div>
                        </div>
                        <span class="region-badge">${player.region}</span>
                    </div>

                    <div class="tiers-row">
                        ${tiersHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectMode(mode, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            renderLeaderboard(mode);
        }

        function filterPlayers() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.player-card');
            cards.forEach(card => {
                const name = card.querySelector('.player-name').innerText.toLowerCase();
                card.style.display = name.includes(input) ? "flex" : "none";
            });
        }

        function copyIP() {
            navigator.clipboard.writeText("MYPVP.Mikey");
            alert("تم نسخ IP الخادم: MYPVP.Mikey");
        }

        renderLeaderboard('overall');
    </script>
</body>
</html>
