<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --navbar-bg: #151d2a;
            --card-bg: #141c2b;
            --input-bg: #111827;
            --border-color: #232f42;
            --text-gray: #8d9bb0;
            --active-blue: #3b82f6;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: rtl;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Top Header Navigation Bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
            direction: ltr;
        }

        .logo-my {
            background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-tiers {
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 2px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 34px 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--active-blue);
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 12px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Categories Navigation Bar */
        .modes-nav-container {
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modes-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            direction: rtl;
        }

        .modes-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .modes-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-gray);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .nav-item img, .nav-item i {
            width: 22px;
            height: 22px;
            font-size: 18px;
            margin-bottom: 4px;
            object-fit: contain;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 700;
        }

        .nav-item.active {
            background: #212d42;
            border-color: var(--active-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        /* Server Banner */
        .server-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .info-btn i {
            color: #3b82f6;
            font-size: 14px;
        }

        .server-box {
            display: flex;
            align-items: center;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .server-title-text {
            font-size: 13px;
            font-weight: 900;
            color: #ef4444;
            white-space: nowrap;
            font-family: 'Arial Black', sans-serif;
        }

        .ip-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ip-label {
            font-size: 10px;
            color: var(--text-gray);
        }

        .ip-address {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* Player Card Component */
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-info-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-box {
            background: #f59e0b;
            color: #000;
            font-weight: 900;
            font-size: 20px;
            padding: 4px 10px;
            border-radius: 8px;
            font-style: italic;
        }

        .avatar-box {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #232f42;
            overflow: hidden;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-details {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-weight: 800;
            font-size: 16px;
            color: #ffffff;
        }

        .player-subtitle {
            font-size: 11px;
            color: var(--text-gray);
        }

        .region-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
        }

        /* Levels Section Title Positioned Above/Left */
        .levels-header {
            display: flex;
            justify-content: flex-end; /* لرفعه وإزاحته نحو اليسار والقمة */
            margin-bottom: -4px;
            margin-top: -2px;
        }

        .levels-title {
            font-size: 13px;
            font-weight: 800;
            color: #e2e8f0;
        }

        /* Tier Slots Row (Enlarged & Shifted to Left/Top) */
        .tiers-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 2px;
            justify-content: flex-start; /* ينزاح إلى اليسار بالتنسيق */
            direction: ltr; /* الترتيب يبدأ يساراً */
        }

        .tiers-row::-webkit-scrollbar {
            display: none;
        }

        /* Enlarged Circular/Pill Tier Badges */
        .tier-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border-radius: 22px;
            padding: 8px 10px; /* تكبير الحجم */
            min-width: 48px; /* زيادة العرض */
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }

        .tier-slot:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Enlarged Icons */
        .tier-slot img, .tier-slot i {
            width: 22px; /* تكبير حجم الأيقونة */
            height: 22px;
            font-size: 18px;
            object-fit: contain;
        }

        .tier-slot .tier-text {
            font-size: 11px;
            font-weight: 900;
            line-height: 1;
            text-align: center;
        }

        /* Tier Colors (Match Image 2 Roles) */
        .tier-ht1, .tier-lt1 { color: #f59e0b; } /* الأصفر */
        .tier-ht2, .tier-lt2 { color: #f97316; } /* البرتقالي */
        .tier-ht3, .tier-lt3 { color: #ef4444; } /* الأحمر */
        .tier-ht4, .tier-lt4 { color: #a855f7; } /* البنفسجي */
        .tier-ht5, .tier-lt5 { color: #3b82f6; } /* الأزرق */

    </style>
</head>
<body>

    <div class="container">

        <!-- Top Header Navigation Bar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ابحث عن المشغل...">
            </div>

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Scrollable Categories Bar (Includes Mace - ميس) -->
        <div class="modes-nav-container">
            <div class="modes-scroll">
                
                <div class="nav-item active" onclick="selectCategory(this, 'all')">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <span>إجمالي</span>
                </div>

                <div class="nav-item" onclick="selectCategory(this, 'mace')">
                    <img src="./mace.svg" alt="ميس" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869112.png'">
                    <span>ميس</span>
                </div>

                <div class="nav-item" onclick="selectCategory(this, 'sword')">
                    <img src="./sword.svg" alt="سيف" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                    <span>سيف</span>
                </div>

                <div class="nav-item" onclick="selectCategory(this, 'netherite')">
                    <img src="./nethop.svg" alt="نيثوب" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3522/3522292.png'">
                    <span>نيثوب</span>
                </div>

                <div class="nav-item" onclick="selectCategory(this, 'smp')">
                    <img src="./smp.svg" alt="SMP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041883.png'">
                    <span>SMP</span>
                </div>

                <div class="nav-item" onclick="selectCategory(this, 'pot')">
                    <img src="./pot.svg" alt="وعاء" onerror="this.src='https://cdn-icons-png.flaticon.com/512/868/868781.png'">
                    <span>وعاء</span>
                </div>

                <div class="nav-item" onclick="selectCategory(this, 'vanilla')">
                    <img src="./vanilla.svg" alt="فانيليا" onerror="this.src='https://cdn-icons-png.flaticon.com/512/188/188333.png'">
                    <span>فانيليا</span>
                </div>

            </div>
        </div>

        <!-- Server Info Banner -->
        <div class="server-banner">
            
            <button class="info-btn">
                <i class="fa-solid fa-circle-info"></i>
                <span>معلومة</span>
            </button>

            <div class="server-box">
                <span class="server-title-text">PVP MIKEY</span>

                <div class="ip-container">
                    <span class="ip-label">عنوان IP للخادم</span>
                    <span class="ip-address" onclick="copyIP()">
                        MYPVP.Mikey
                        <i class="fa-regular fa-copy"></i>
                    </span>
                </div>

                <a href="https://discord.gg/3HtDCJV3x" target="_blank" class="discord-btn" title="Join Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
            </div>

        </div>

        <!-- Leaderboard Player Cards Container -->
        <div class="leaderboard-list" id="playerContainer">

            <!-- Top Player 1 Card (Dynamic Demo) -->
            <div class="player-card">
                <div class="player-header">
                    <div class="player-info-right">
                        <div class="rank-box">.1</div>
                        <div class="avatar-box">
                            <img src="https://mc-heads.net/avatar/Marlo/48" alt="مارلو">
                        </div>
                        <div class="player-details">
                            <span class="player-name">مارلو</span>
                            <span class="player-subtitle"> (4) سيد القتال الكبير 🌟</span>
                        </div>
                    </div>
                    <span class="region-badge">غير متوفر</span>
                </div>

                <!-- Levels Title Positioned at Top/Right -->
                <div class="levels-header">
                    <span class="levels-title">المستويات</span>
                </div>

                <!-- Circular Tier Badges Row (Large & Shifted Left) -->
                <div class="tiers-row">
                    <div class="tier-slot">
                        <img src="./mace.svg" alt="mace" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869112.png'">
                        <span class="tier-text tier-ht1">HT1</span>
                    </div>
                    <div class="tier-slot">
                        <img src="./sword.svg" alt="sword" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                        <span class="tier-text tier-ht1">HT1</span>
                    </div>
                    <div class="tier-slot">
                        <img src="./axe.svg" alt="axe" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869108.png'">
                        <span class="tier-text tier-ht1">HT1</span>
                    </div>
                    <div class="tier-slot">
                        <img src="./vanilla.svg" alt="vanilla" onerror="this.src='https://cdn-icons-png.flaticon.com/512/188/188333.png'">
                        <span class="tier-text tier-ht1">HT1</span>
                    </div>
                    <div class="tier-slot">
                        <img src="./uhc.svg" alt="uhc" onerror="this.src='https://cdn-icons-png.flaticon.com/512/868/868781.png'">
                        <span class="tier-text tier-ht1">HT1</span>
                    </div>
                    <div class="tier-slot">
                        <img src="./nethop.svg" alt="nethop" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3522/3522292.png'">
                        <span class="tier-text tier-ht1">HT1</span>
                    </div>
                    <div class="tier-slot">
                        <i class="fa-solid fa-heart tier-lt1"></i>
                        <span class="tier-text tier-lt1">LT1</span>
                    </div>
                    <div class="tier-slot">
                        <img src="./spearmace.svg" alt="spear" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                        <span class="tier-text tier-lt1">LT1</span>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("MYPVP.Mikey");
            alert("تم نسخ IP الخادم: MYPVP.Mikey");
        }

        // Change Categories and Filter Top Player
        function selectCategory(element, category) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // Example response when selecting "Mace" or other categories
            if(category === 'mace') {
                console.log("عرض أقوى لاعب في تصنيف الميس");
            }
        }
    </script>
</body>
</html>
