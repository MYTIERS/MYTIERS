<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --navbar-bg: #151d2a;
            --card-bg: #141c2b;
            --input-bg: #111827;
            --border-color: #232f42;
            --text-gray: #8d9bb0;
            --active-blue: #3b82f6;
            --gold: #f1b333;
            --silver: #a0acb2;
            --bronze: #cb6835;
            --pink-accent: #f43f5e;
            --modal-bg: #121824;
            --modal-card-bg: #192231;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: ltr;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Top Header Navigation Bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }

        .logo-my {
            color: #2563eb;
            background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-tiers {
            color: #f59e0b;
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 2px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px 8px 34px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--active-blue);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 12px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Categories Bar */
        .modes-nav-container {
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modes-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .modes-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .modes-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 68px;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-gray);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .nav-item img {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            object-fit: contain;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            background: #212d42;
            border-color: var(--active-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        /* Server Info Banner */
        .server-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .info-btn:hover {
            background: #1e293b;
        }

        .info-btn i {
            color: #3b82f6;
            font-size: 14px;
        }

        .server-box {
            display: flex;
            align-items: center;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .server-title-text {
            font-size: 13px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
        }

        .ip-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ip-label {
            font-size: 10px;
            color: var(--text-gray);
            font-weight: 500;
        }

        .ip-address {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ip-address i {
            font-size: 10px;
            color: var(--text-gray);
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* Leaderboard Player Cards Container */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .player-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-banner {
            position: relative;
            width: 120px;
            height: 48px;
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 0 10px;
            clip-path: polygon(0 0, 80% 0, 100% 100%, 0% 100%);
            flex-shrink: 0;
        }

        .player-banner.rank-1 { background-color: var(--gold); }
        .player-banner.rank-2 { background-color: var(--silver); }
        .player-banner.rank-3 { background-color: var(--bronze); }
        .player-banner.rank-other { background-color: #232f42; }

        .rank-number {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
        }

        .player-skin {
            height: 110%;
            object-fit: contain;
            filter: drop-shadow(-2px 2px 4px rgba(0, 0, 0, 0.4));
        }

        .player-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .player-name {
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .player-sub-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .points-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gray);
            direction: rtl;
        }

        .title-badge {
            font-size: 12px;
            font-weight: 800;
            color: #e2e8f0;
        }

        .region-tag {
            background: #14532d;
            color: #22c55e;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #16a34a;
        }

        .modes-grid {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            direction: rtl;
            padding-bottom: 4px;
        }

        .modes-grid::-webkit-scrollbar {
            display: none;
        }

        .mode-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            flex-shrink: 0;
        }

        .icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #111827;
            border: 1px solid #232f42;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .icon-circle img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .icon-circle i {
            font-size: 16px;
        }

        .tier-label {
            font-size: 10px;
            font-weight: 700;
            color: #6b7280;
            white-space: nowrap;
        }

        .mode-item.ranked .icon-circle {
            border: 2px solid #f59e0b;
            background: #1f293d;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        .mode-item.ranked .tier-label {
            color: #f59e0b;
            font-weight: 900;
            font-size: 11px;
        }

        /* ----- MODAL FIXES AND DESIGN ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid #1e293b;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            direction: rtl;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            font-size: 20px;
            cursor: pointer;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #f43f5e;
            margin: 16px 0 10px 0;
        }

        .points-table {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .points-row {
            background: var(--modal-card-bg);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
        }

        .points-col {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .points-col .highlight {
            color: #ffffff;
            font-weight: 800;
        }

        .titles-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .title-item {
            background: var(--modal-card-bg);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .title-name {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        .title-req {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-gray);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Top Header Navigation Bar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterPlayers()" placeholder="Search player...">
            </div>

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Categories Bar -->
        <div class="modes-nav-container">
            <div class="modes-scroll">
                <div class="nav-item active" onclick="selectMode('overall', this)">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <span>Overall</span>
                </div>
                <div class="nav-item" onclick="selectMode('vanilla', this)">
                    <img src="./vanilla.svg" alt="Vanilla" onerror="this.src='https://cdn-icons-png.flaticon.com/512/188/188333.png'">
                    <span>VANILLA</span>
                </div>
                <div class="nav-item" onclick="selectMode('uhc', this)">
                    <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
                    <span>UHC</span>
                </div>
                <div class="nav-item" onclick="selectMode('pot', this)">
                    <img src="./pot.svg" alt="Pot" onerror="this.src='https://cdn-icons-png.flaticon.com/512/868/868781.png'">
                    <span>POT</span>
                </div>
                <div class="nav-item" onclick="selectMode('smp', this)">
                    <img src="./smp.svg" alt="SMP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041883.png'">
                    <span>SMP</span>
                </div>
                <div class="nav-item" onclick="selectMode('nethop', this)">
                    <img src="./nethop.svg" alt="NethOP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3522/3522292.png'">
                    <span>NETHOP</span>
                </div>
                <div class="nav-item" onclick="selectMode('sword', this)">
                    <img src="./sword.svg" alt="Sword" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                    <span>SWORD</span>
                </div>
                <div class="nav-item" onclick="selectMode('axe', this)">
                    <img src="./axe.svg" alt="Axe" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869108.png'">
                    <span>AXE</span>
                </div>
                <div class="nav-item" onclick="selectMode('mace', this)">
                    <img src="./mace.svg" alt="Mace" onerror="this.src='https://cdn-icons-png.flaticon.com/512/869/869112.png'">
                    <span>MACE</span>
                </div>
                <div class="nav-item" onclick="selectMode('spearmace', this)">
                    <img src="./spearmace.svg" alt="Spear Mace" onerror="this.src='https://cdn-icons-png.flaticon.com/512/929/929432.png'">
                    <span>SPEAR MACE</span>
                </div>
            </div>
        </div>

        <!-- Server Info Banner -->
        <div class="server-banner">
            <button class="info-btn" id="infoBtn">
                <i class="fa-solid fa-circle-info"></i>
                <span>معلومة</span>
            </button>

            <div class="server-box">
                <span class="server-title-text">PVP MIKEY</span>

                <div class="ip-container">
                    <span class="ip-label">عنوان IP للخادم</span>
                    <span class="ip-address" onclick="copyIP()">
                        MYPVP.Mikey
                        <i class="fa-regular fa-copy"></i>
                    </span>
                </div>

                <a href="https://discord.gg/3HtDCJV3x" target="_blank" class="discord-btn" title="Join Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
            </div>
        </div>

        <!-- Leaderboard List -->
        <div class="leaderboard-list" id="leaderboardList"></div>

    </div>

    <!-- Info Modal -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">النقاط وألقاب الإنجازات</h3>
                <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Points Section -->
            <div class="section-title">حساب النقاط</div>
            <div class="points-table">
                <div class="points-row">
                    <div class="points-col"><span>LT1</span> | <span class="highlight">45 نقطة</span></div>
                    <div class="points-col"><span>HT1</span> | <span class="highlight">60 نقطة</span></div>
                </div>
                <div class="points-row">
                    <div class="points-col"><span>LT2</span> | <span class="highlight">20 نقطة</span></div>
                    <div class="points-col"><span>HT2</span> | <span class="highlight">30 نقطة</span></div>
                </div>
                <div class="points-row">
                    <div class="points-col"><span>LT3</span> | <span class="highlight">6 نقاط</span></div>
                    <div class="points-col"><span>HT3</span> | <span class="highlight">10 نقاط</span></div>
                </div>
                <div class="points-row">
                    <div class="points-col"><span>LT4</span> | <span class="highlight">3 نقاط</span></div>
                    <div class="points-col"><span>HT4</span> | <span class="highlight">4 نقاط</span></div>
                </div>
                <div class="points-row">
                    <div class="points-col"><span>LT5</span> | <span class="highlight">نقطة واحدة</span></div>
                    <div class="points-col"><span>HT5</span> | <span class="highlight">نقطتان</span></div>
                </div>
            </div>

            <!-- Achievement Section -->
            <div class="section-title">ألقاب الإنجازات</div>
            <div class="titles-list" id="titlesContainer"></div>
        </div>
    </div>

    <script>
        const titlesData = [
            { name: "أستاذ فنون القتال", req: "أكثر من 400 نقطة", icon: "fa-solid fa-gem", color: "#f59e0b" },

        const playersData = [

            {

                skinUrl: "https://visage.surgeplay.com/bust/512/M4ster.png",
                modes: {

                    sword: "HT2",
                    axe: "HT3",

                }
            }
        ];

        function renderTitlesModal() {
            const container = document.getElementById("titlesContainer");
            if (!container) return;
            container.innerHTML = "";

            titlesData.forEach(item => {
                const titleDiv = document.createElement("div");
                titleDiv.className = "title-item";
                titleDiv.innerHTML = `
                    <div class="title-info">
                        <div class="title-icon">
                            <i class="${item.icon}" style="color: ${item.color}"></i>
                        </div>
                        <span class="title-name">${item.name}</span>
                    </div>
                    <span class="title-req">${item.req}</span>
                `;
                container.appendChild(titleDiv);
            });
        }

        function renderLeaderboard(selectedMode = 'overall') {
            const container = document.getElementById("leaderboardList");
            if (!container) return;
            container.innerHTML = "";

            let displayPlayers = [...playersData];

            if (selectedMode === 'overall') {
                displayPlayers.sort((a, b) => parseInt(b.points) - parseInt(a.points));
            }

            displayPlayers.forEach((player, index) => {
                const rankNum = index + 1;
                let rankClass = "rank-other";
                if (rankNum === 1) rankClass = "rank-1";
                if (rankNum === 2) rankClass = "rank-2";
                if (rankNum === 3) rankClass = "rank-3";

                const card = document.createElement("div");
                card.className = "player-card";
                card.setAttribute("data-name", player.name);

                let modesHTML = "";
                modeIcons.forEach(m => {
                    const tier = player.modes[m.id] || "غير مصنف";
                    const isRanked = tier !== "غير مصنف";
                    let iconMarkup = m.iconType === "img" 
                        ? `<img src="${m.src}" alt="${m.id}" onerror="this.src='${m.fallback}'">`
                        : `<i class="${m.class}" style="color: ${m.color}"></i>`;

                    modesHTML += `
                        <div class="mode-item ${isRanked ? 'ranked' : ''}">
                            <div class="icon-circle">
                                ${iconMarkup}
                            </div>
                            <span class="tier-label">${tier}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="player-header">
                        <div class="player-info-left">
                            <div class="player-banner ${rankClass}">
                                <span class="rank-number">${rankNum}.</span>
                                <img class="player-skin" src="${player.skinUrl}" alt="${player.name}" onerror="this.src='https://visage.surgeplay.com/bust/512/Steve.png'">
                            </div>
                            <div class="player-details">
                                <span class="player-name">${player.name}</span>
                                <div class="player-sub-info">
                                    <span class="title-badge">${player.title}</span>
                                    <span class="points-badge">(${player.points} نقطة)</span>
                                </div>
                            </div>
                        </div>

                        <div class="region-tag">${player.region}</div>
                    </div>

                    <div class="modes-grid">
                        ${modesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterPlayers() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.player-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name') || "";
                card.style.display = name.toLowerCase().includes(input) ? "flex" : "none";
            });
        }

        function copyIP() {
            navigator.clipboard.writeText("MYPVP.Mikey");
            alert("تم نسخ IP الخادم: MYPVP.Mikey");
        }

        // Event Listeners (ربط الأحداث بالزر بشكل آمن وعازل للأخطاء)
        document.addEventListener("DOMContentLoaded", function() {
            renderTitlesModal();
            renderLeaderboard('overall');

            const infoBtn = document.getElementById("infoBtn");
            const modal = document.getElementById("infoModal");
            const closeBtn = document.getElementById("closeModalBtn");

            if (infoBtn && modal) {
                infoBtn.addEventListener("click", function() {
                    modal.classList.add("active");
                });
            }

            if (closeBtn && modal) {
                closeBtn.addEventListener("click", function() {
                    modal.classList.remove("active");
                });
            }

            if (modal) {
                modal.addEventListener("click", function(e) {
                    if (e.target === modal) {
                        modal.classList.remove("active");
                    }
                });
            }
        });
    </script>
</body>
</html>
