<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f17;
            --navbar-bg: #111724;
            --input-bg: #161e2e;
            --border-color: #1a2333;
            --text-gray: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: ltr;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Top Bar Container - Soft & Smooth Background */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        /* MYTIERS Logo Style */
        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 0.5px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }

        .logo-my {
            color: #2563eb;
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }

        .logo-tiers {
            color: #f59e0b;
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
            margin-left: 2px;
        }

        /* Search Input Box */
        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px 8px 34px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: #3b82f6;
            background: #192334;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 12px;
        }

        /* Hamburger Menu Icon */
        .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Placeholder Content */
        .content-area {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Top Header Navigation Bar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search player...">
            </div>

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Next element goes here -->
        <div class="content-area"></div>

    </div>

</body>
</html>
