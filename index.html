<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTiers Replica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0d14;
            --card-bg: #111622;
            --tier-bg: #182030;
            --ht-orange: #f97316;
            --lt-blue: #3b82f6;
            --text-gray: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: ltr;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        /* Card Container */
        .player-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #1a2332;
            position: relative;
        }

        /* Top Header Row */
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            height: 48px;
            margin-bottom: 15px;
        }

        /* Yellow Rank Banner */
        .rank-banner {
            position: relative;
            background: #eab308;
            height: 38px;
            width: 140px;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
            display: flex;
            align-items: center;
            padding-left: 12px;
            border-radius: 4px 0 0 4px;
        }

        .rank-num {
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            color: #000;
        }

        /* Minecraft Body Render floating over banner */
        .player-render {
            position: absolute;
            left: 55px;
            bottom: -4px;
            height: 52px;
            z-index: 2;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
        }

        /* Player Details Next to Banner */
        .player-info {
            position: absolute;
            left: 135px;
            top: 2px;
        }

        .player-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            line-height: 1.2;
        }

        .player-rank-title {
            font-size: 11px;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .rank-icon {
            color: #eab308;
            font-size: 10px;
        }

        /* Status Tag (Top Right) */
        .status-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }

        .status-badge.eu {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* Tiers Section */
        .tiers-header {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .tiers-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        /* MCTiers Round Top Capsule Box */
        .tier-capsule {
            background: #141b27;
            border: 1px solid #1e2838;
            border-radius: 14px 14px 8px 8px;
            width: 38px;
            height: 46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 4px;
            position: relative;
            flex-shrink: 0;
        }

        .tier-capsule .icon-area {
            position: absolute;
            top: 4px;
            font-size: 12px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tier-capsule .tier-type {
            font-size: 9px;
            font-weight: bold;
            line-height: 1;
        }

        .tier-capsule .tier-num {
            font-size: 10px;
            font-weight: bold;
            line-height: 1.1;
        }

        /* Colors */
        .tier-capsule.ht .tier-type,
        .tier-capsule.ht .tier-num {
            color: var(--ht-orange);
        }

        .tier-capsule.lt .tier-type,
        .tier-capsule.lt .tier-num {
            color: var(--lt-blue);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Player Card 1 -->
        <div class="player-card">
            <div class="card-top">
                <div class="rank-banner">
                    <span class="rank-num">1.</span>
                </div>
                <!-- Minecraft Body Render -->
                <img src="https://mc-heads.net/body/Marlo/right" class="player-render" alt="Marlo">

                <div class="player-info">
                    <div class="player-name">Marlo</div>
                    <div class="player-rank-title">
                        <i class="fa-solid fa-gem rank-icon"></i>
                        <span>Grand Combat Master (4)</span>
                    </div>
                </div>

                <span class="status-badge">N/A</span>
            </div>

            <div class="tiers-header">Tiers</div>

            <div class="tiers-row">
                <div class="tier-capsule ht">
                    <div class="icon-area"><i class="fa-solid fa-location-arrow" style="color:#3b82f6;"></i></div>
                    <span class="tier-type">HT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule ht">
                    <div class="icon-area"></div>
                    <span class="tier-type">HT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule ht">
                    <div class="icon-area"><i class="fa-solid fa-gem" style="color:#a855f7;"></i></div>
                    <span class="tier-type">HT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule ht">
                    <div class="icon-area"><i class="fa-solid fa-flask" style="color:#ec4899;"></i></div>
                    <span class="tier-type">HT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule ht">
                    <div class="icon-area"></div>
                    <span class="tier-type">HT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule ht">
                    <div class="icon-area"></div>
                    <span class="tier-type">HT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule lt">
                    <div class="icon-area"><i class="fa-solid fa-heart" style="color:#ef4444;"></i></div>
                    <span class="tier-type">LT</span>
                    <span class="tier-num">1</span>
                </div>
                <div class="tier-capsule lt">
                    <div class="icon-area"><i class="fa-solid fa-axe" style="color:#38bdf8;"></i></div>
                    <span class="tier-type">LT</span>
                    <span class="tier-num">1</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
