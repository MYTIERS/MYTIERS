<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --navbar-bg: #151d2a;
            --card-bg: #1a2332;
            --input-bg: #111827;
            --border-color: #232f42;
            --text-gray: #8d9bb0;
            --active-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: ltr;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Top Header Navigation Bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }

        .logo-my {
            color: #2563eb;
            background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-tiers {
            color: #f59e0b;
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 2px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px 8px 34px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--active-blue);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 12px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Single Horizontal Scrollable Categories Bar */
        .modes-nav-container {
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modes-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .modes-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .modes-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 68px;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-gray);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .nav-item img {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            object-fit: contain;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            background: #212d42;
            border-color: var(--active-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        /* Server Info Banner Below Navigation */
        .server-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 4px;
        }

        .info-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .info-btn i {
            color: #3b82f6;
            font-size: 14px;
        }

        .server-box {
            display: flex;
            align-items: center;
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        /* Server Name Text Style (No Logo Box) */
        .server-title-text {
            font-size: 13px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
        }

        .ip-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ip-label {
            font-size: 10px;
            color: var(--text-gray);
            font-weight: 500;
        }

        .ip-address {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ip-address i {
            font-size: 10px;
            color: var(--text-gray);
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            transition: transform 0.2s, background-color 0.2s;
            flex-shrink: 0;
        }

        .discord-btn:hover {
            background: #4752C4;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Top Header Navigation Bar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search player...">
            </div>

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Single Horizontal Scrollable Categories Bar -->
        <div class="modes-nav-container">
            <div class="modes-scroll">
                
                <div class="nav-item active">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <span>Overall</span>
                </div>

                <div class="nav-item">
                    <img src="./spearmace.svg" alt="LTMs">
                    <span>LTMs</span>
                </div>

                <div class="nav-item">
                    <img src="./vanilla.svg" alt="Vanilla">
                    <span>Vanilla</span>
                </div>

                <div class="nav-item">
                    <img src="./pot.svg" alt="Pot">
                    <span>Pot</span>
                </div>

                <div class="nav-item">
                    <img src="./nethop.svg" alt="NethOP">
                    <span>NethOP</span>
                </div>

                <div class="nav-item">
                    <img src="./smp.svg" alt="SMP">
                    <span>SMP</span>
                </div>

                <div class="nav-item">
                    <img src="./sword.svg" alt="Sword">
                    <span>Sword</span>
                </div>

                <div class="nav-item">
                    <img src="./axe.svg" alt="Axe">
                    <span>Axe</span>
                </div>

                <div class="nav-item">
                    <img src="./mace.svg" alt="Mace">
                    <span>Mace</span>
                </div>

                <div class="nav-item">
                    <img src="./uhc.svg" alt="UHC">
                    <span>UHC</span>
                </div>

            </div>
        </div>

        <!-- Server Info Banner -->
        <div class="server-banner">
            
            <button class="info-btn">
                <i class="fa-solid fa-circle-info"></i>
                <span>معلومة</span>
            </button>

            <div class="server-box">
                <!-- Server Name Text Instead of Logo -->
                <span class="server-title-text">PVP MIKEY</span>

                <div class="ip-container">
                    <span class="ip-label">عنوان IP للخادم</span>
                    <span class="ip-address" onclick="copyIP()">
                        MYPVP.Mikey
                        <i class="fa-regular fa-copy"></i>
                    </span>
                </div>

                <!-- Discord Link Button -->
                <a href="https://discord.gg/3HtDCJV3x" target="_blank" class="discord-btn" title="Join Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
            </div>

        </div>

    </div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("MYPVP.Mikey");
            alert("تم نسخ IP الخادم: MYPVP.Mikey");
        }
    </script>
</body>
</html>
