<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTIERS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #111827;       /* لون خلفية أفتح وأوضح */
            --navbar-bg: #1f293d;     /* لون العناصر */
            --card-bg: #1a2332;
            --input-bg: #16202e;
            --border-color: #2b384e;
            --text-gray: #94a3b8;
            --active-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 12px;
            direction: ltr;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Top Bar Navigation */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--navbar-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            margin-bottom: 12px;
        }

        /* Logo MYTIERS */
        .logo-box {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 0.5px;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }

        .logo-my {
            color: #2563eb;
            background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        .logo-tiers {
            color: #f59e0b;
            background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
            margin-left: 2px;
        }

        /* Search Box */
        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px 8px 34px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--active-blue);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 12px;
        }

        /* Menu Button */
        .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Categories Bar - Single Scrollable Navigation Bar */
        .modes-nav-container {
            background: var(--navbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .modes-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 4px;
        }

        /* Hide Scrollbar for clean view */
        .modes-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .modes-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 68px;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-gray);
            flex-shrink: 0;
        }

        .nav-item i, .nav-item img {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        /* Active Selected State */
        .nav-item.active {
            background: #252f44;
            border-color: var(--active-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .nav-item.active i {
            color: #f59e0b;
        }

        /* Custom Icon Colors */
        .icon-gold { color: #f59e0b; }
        .icon-swords { color: #94a3b8; }
        .icon-crystal { color: #c084fc; }
        .icon-pot { color: #f43f5e; }
        .icon-helmet { color: #a855f7; }
        .icon-pearl { color: #10b981; }
        .icon-sword { color: #3b82f6; }
        .icon-axe { color: #38bdf8; }
        .icon-mace { color: #91a3b8; }

        /* Content Area Placeholder */
        .content-area {
            min-height: 100px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Top Header Navigation Bar -->
        <div class="top-navbar">
            <div class="logo-box">
                <span class="logo-my">MY</span><span class="logo-tiers">TIERS</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search player...">
            </div>

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Single Horizontal Scrollable Categories Bar -->
        <div class="modes-nav-container">
            <div class="modes-scroll">
                
                <div class="nav-item active">
                    <i class="fa-solid fa-trophy icon-gold"></i>
                    <span>Overall</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-crosshairs icon-swords"></i>
                    <span>LTMs</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-cube icon-crystal"></i>
                    <span>Vanilla</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-flask icon-pot"></i>
                    <span>Pot</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-shield-halved icon-helmet"></i>
                    <span>NethOP</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-gem icon-pearl"></i>
                    <span>SMP</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-sword icon-sword"></i>
                    <span>Sword</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-hammer icon-axe"></i>
                    <span>Axe</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-mace icon-mace"></i>
                    <span>Mace</span>
                </div>

            </div>
        </div>

        <!-- Area for the next element -->
        <div class="content-area"></div>

    </div>

</body>
</html>
